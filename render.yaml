services:
  - type: web
    name: markethub
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev && npm ci --prefix frontend --include=dev && npm run build --prefix frontend
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
